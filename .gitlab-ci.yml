stages:
  - test

# Every registry entry is validated against the schema shipped by the R3XA_API
# build named in requirements-dev.txt. That file currently tracks `develop`:
# the entries use `data_origin`, which no published tag carries yet. A pinned
# tag would be the better contract once 2.0.0 is out - until then it would only
# prove the entries match a schema the project has already moved past.
validate:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    paths:
      - .cache/pip
  before_script:
    # git is required: requirements-dev.txt installs R3XA_API from a git tag.
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-dev.txt
  script:
    # Record which R3XA_API build the entries were validated against.
    # No pipe here: GitLab runs the script with `pipefail`, and a closed pipe
    # would fail the job.
    - python -m pip show r3xa-api
    - python -c "import r3xa_api; print('schema', r3xa_api.schema_version())"
    - python scripts/validate_all.py
    - python -m pytest -q
